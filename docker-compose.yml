# Local stack: Postgres (data + Airflow metadata) and Airflow in standalone mode (DS1, DS7).
# Everything binds to localhost only; the DB password below is for local use only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gridflex
      POSTGRES_PASSWORD: gridflex
      POSTGRES_DB: gridflex
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro  # runs once, on first start
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gridflex"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env  # EIA_API_KEY
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://gridflex:gridflex@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GRIDFLEX_DB_URL: postgresql://gridflex:gridflex@postgres:5432/gridflex
      PYTHONPATH: /opt/airflow
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./data:/opt/airflow/data:ro
      - airflow_home:/opt/airflow/logs

volumes:
  pgdata:
  airflow_home:
